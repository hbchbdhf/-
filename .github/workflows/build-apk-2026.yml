name: build-apk-2026

# 备用流水线：用 p4a v2026.05.09（新 NDK，支持 Android 15/16 与 16KB 内存页）
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    env:
      JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 切到 p4a v2026.05.09
        run: |
          sed -i 's|^p4a.branch.*|p4a.branch = v2026.05.09|' buildozer.spec
          sed -i 's|^version = .*|version = 1.3.0|' buildozer.spec
          sed -i 's|^android.api = .*|android.api = 34|' buildozer.spec
          grep -nE "^(version|android.api|p4a.branch)" buildozer.spec

      - name: 安装系统依赖与 buildozer
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git zip unzip openjdk-17-jdk-headless \
            autoconf automake libtool libtool-bin pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev
          python -m pip install --upgrade pip
          pip install buildozer "cython<3" virtualenv

      - name: 缓存 SDK / NDK / 编译产物
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            ~/.gradle
          key: buildozer-2026-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-2026-

      - name: 构建 APK
        run: |
          set -o pipefail
          buildozer -v android debug 2>&1 | tee build.log | tail -80

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-2026
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: 构建失败时上传日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-2026
          path: build.log
          if-no-files-found: warn
