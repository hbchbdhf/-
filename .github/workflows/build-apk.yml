name: build-apk

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 缓存 buildozer 的 SDK/NDK 与编译产物
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-

      - name: 构建 APK（Kivy 官方 buildozer 镜像，工具链版本稳定）
        run: |
          set -o pipefail
          mkdir -p "$HOME/.buildozer"
          docker run --rm \
            -v "$PWD":/home/user/hostcwd \
            -v "$HOME/.buildozer":/home/user/.buildozer \
            -e CI=true \
            kivy/buildozer:latest -v android debug 2>&1 | tee build.log | tail -80

      - name: 修正文件权限
        if: always()
        run: |
          sudo chown -R "$(id -u):$(id -g)" bin .buildozer 2>/dev/null || true
          ls -la bin || true

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: 构建失败时上传日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: warn
