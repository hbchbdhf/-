name: build-apk

on:
  push:
  workflow_dispatch:

jobs:
  build:
    # 关键：22.04 镜像的 autoconf 2.71 能编译 libffi，24/26 镜像会挂
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    env:
      # 让 p4a 内部 venv 的 pip 停在 24.x，否则会拒绝安装 android 平台标签的 wheel
      PIP_CONSTRAINT: ${{ github.workspace }}/constraints.txt

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: 安装系统依赖与 buildozer
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git zip unzip openjdk-17-jdk-headless \
            autoconf automake libtool libtool-bin pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev
          python -m pip install --upgrade "pip<25"
          pip install buildozer==1.5.0 "cython<3" virtualenv

      - name: 缓存 SDK / NDK / 编译产物
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            ~/.gradle
          key: buildozer-v2-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-v2-

      - name: 构建 APK
        run: |
          set -o pipefail
          buildozer -v android debug 2>&1 | tee build.log | tail -80

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: 构建失败时上传日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: warn
